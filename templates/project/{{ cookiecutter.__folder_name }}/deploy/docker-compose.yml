services:
  backend:
    container_name: backend
    restart: unless-stopped
    {%- if cookiecutter.postgres %}
    depends_on:
      - postgres
    {%- else %}
    depends_on:
      - zeo
    {%- endif %}
    environment:
    {%- if cookiecutter.postgres %}
      ZODB_PGJSONB_DSN: dbname='${DB_NAME:?DB_NAME is required}' user='${DB_USER:?DB_USER is required}' password='${DB_PASSWORD:?DB_PASSWORD is required}' host='${DB_HOST:?DB_HOST is required}'
      ZODB_PGJSONB_HISTORY_PRESERVING: true
      {%- if cookiecutter.thumbor %}
      PGTHUMBOR_SECURITY_KEY: {{ cookiecutter.security_key }}
      PGTHUMBOR_SERVER_URL: https://${SERVER_DOMAIN:?SERVER_DOMAIN is required}/thumbor/
      {%- endif %}
    {%- else %}
      ZEO_ADDRESS: zeo:8100
      ZEO_SHARED_BLOB_DIR: true
    {%- endif %}
      ZOPE_FORM_MEMORY_LIMIT: 100MB
      ZOPE_FORM_DISK_LIMIT: 100MB
      ZOPE_FORM_MEMFILE_LIMIT: 100MB
      CLIENT_HOME: /app/
      PLONE_REGISTRY_YAML: /plone-conf/plone.yml
      TZ: Europe/Madrid

    volumes:
      - ./data/zeo:/data
      - ./plone-conf:/plone-conf
    extra_hosts:
      - "host.docker.internal:host-gateway"

    image: {{ cookiecutter.__container_image_prefix }}/backend:${VERSION:?VERSION is required}
    ports:
      - 8080:8080

  caddy:
    container_name: caddy
    restart: unless-stopped
    image: caddy
    environment:
      - SERVER_DOMAIN=${SERVER_DOMAIN:?SERVER_DOMAIN is required}
      - CADDY_BACKEND=${CADDY_BACKEND:?CADDY_BACKEND is required}
      - CADDY_BACKEND_PORT=${CADDY_BACKEND_PORT:?CADDY_BACKEND_PORT is required}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./conf/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

{%- if cookiecutter.feature_headless %}
  frontend:
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      RAZZLE_API_PATH: https://${SERVER_DOMAIN:?SERVER_DOMAIN is required}
      RAZZLE_INTERNAL_API_PATH: http://backend:8080/Plone

    image: {{ cookiecutter.__container_image_prefix }}/frontend:${VERSION:?VERSION is required}
{%- endif %}


{%- if cookiecutter.postgres %}
  postgres:
    # HINT:
    # - Using the postgres:17 image, you will have tsvector based search
    # - Using the tensorchord/vchord-suite:pg17-latest image, you will have BM25 ranking
    # You can set the value here or in the .env file
    container_name: postgres
    image: ${PG_IMAGE:-postgres:17}
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER is required}"]
      interval: 5s
      timeout: 3s
      retries: 5


  {%- if cookiecutter.thumbor %}
  thumbor:
    container_name: thumbor
    depends_on:
      - postgres
    image: ghcr.io/bluedynamics/zodb-pgjsonb-thumborblobloader:0.4.2
    environment:
      PGTHUMBOR_DSN: "dbname=${DB_NAME:?DB_NAME is required} user=${DB_USER:?DB_USER is required} password=${DB_PASSWORD:?DB_PASSWORD is required} host=${DB_HOST:?DB_HOST is required}"
      THUMBOR_SECURITY_KEY: "{{ cookiecutter.security_key }}"
      ALLOW_UNSAFE_URL: "True"
      PGTHUMBOR_PLONE_AUTH_URL: "${SERVER_DOMAIN:?SERVER_DOMAIN is required}"
      PGTHUMBOR_AUTH_CACHE_TTL: "60"
  {%- endif %}

{%- else %}
  zeo:
    container_name: zeo
    restart: unless-stopped
    image: plone/plone-zeo:6.0.0
    volumes:
      - ./data/zeo:/data
    environment:
      ZEO_PACK_KEEP_OLD: false

{%- endif %}

  nginx:
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - backend
      {%- if cookiecutter.feature_headless %}
      - frontend
      {%- endif %}
    image: nginx
    environment:
      SERVER_DOMAIN: ${SERVER_DOMAIN:?SERVER_DOMAIN is required}
    volumes:
      - ./conf/default.conf.template:/etc/nginx/templates/default.conf.template
      - ./conf/nginx-config-extra.conf:/etc/nginx/conf/nginx-config-extra.conf

  {%- if cookiecutter.devops_cache %}
    {%- if cookiecutter.feature_headless %}
  varnish-frontend:
    container_name: varnish-frontend
    restart: unless-stopped
    ports:
      - 3080:80
    image: varnish:6.0
    volumes:
      - ./conf/varnish_frontend.vcl:/etc/varnish/default.vcl
    depends_on:
      - frontend
    {%- endif %}

  varnish-backend:
    container_name: varnish-backend
    restart: unless-stopped
    ports:
      - 4080:80
    image: varnish:6.0
    volumes:
      - ./conf/varnish_backend.vcl:/etc/varnish/default.vcl
    depends_on:
      - backend
  {%- endif %}

